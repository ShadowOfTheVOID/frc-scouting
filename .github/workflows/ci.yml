name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest a scout lead is likely to have from python.org, and current.
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # There is nothing to install on purpose: the hub runs on a competition
      # laptop with a stock Python and no packages, so CI runs it that way too.
      - name: Solver accuracy gate
        run: python3 server/tests_solver.py

      - name: HTTP surface
        run: python3 server/tests_api.py

      # Lovat's export is somebody else's file format and it will drift. This
      # parses a fixture off disk - no network, no key.
      - name: Lovat import
        run: python3 server/tests_lovat.py

      # Every model on the picker reasons before it answers, out of the same
      # token budget, and each vendor turns that down with a parameter the
      # other two reject. Stubbed HTTP - no network, no key.
      - name: AI adapter
        run: python3 server/tests_ai.py

      # The schedule arrives from Nexus at a real event, under Nexus's own
      # labels, while results arrive from TBA under TBA's keys. They have to
      # land on one row. Seeding only TBA-shaped rows is what let a bug ship
      # where they did not, and every fuel number at a live event became an
      # even three-way split containing no scouting at all.
      - name: Nexus and TBA agree on one row per match
        run: |
          python3 server/seed_demo.py --db data/ci-nexus.db --event 2026demo --via-nexus
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "server")
          from store import Store
          import analytics, hub
          st = Store("data/ci-nexus.db")
          hub.Hub(st).reconcile()
          ms = st.matches("2026demo")
          assert len(ms) == 40, f"{len(ms)} match rows, expected 40 - keys did not merge"
          assert all(m["matchKey"].split("_")[1].startswith("qm") for m in ms),               f"non-canonical keys: {[m['matchKey'] for m in ms][:4]}"
          a = analytics.event_summary(st, "2026demo")
          fuel = [t["estimated"]["avgFuel"] for t in a["teams"].values()
                  if t["estimated"]["matches"]]
          # An even split gives every robot on an alliance the same number; real
          # allocation does not. This is the assertion that would have failed.
          assert len(set(fuel)) > len(fuel) // 2, "fuel looks evenly split, not allocated"
          rep = a["scoreReport"]
          assert rep["compared"] > 10 and rep["medianPct"] < 30, rep
          print(f"ok: {len(ms)} rows, scouts within {rep['medianPct']}% of TBA")
          PY

      - name: Demo event builds and serves with no keys and no internet
        run: |
          python3 server/seed_demo.py --db data/ci.db --event 2026demo
          python3 - <<'PY'
          import subprocess, sys, time, urllib.request, json
          p = subprocess.Popen([sys.executable, "server/hub.py",
                                "--db", "data/ci.db", "--port", "8099", "--no-mdns"])
          try:
              for _ in range(40):
                  try:
                      cfg = json.load(urllib.request.urlopen("http://127.0.0.1:8099/api/config", timeout=2))
                      break
                  except Exception:
                      time.sleep(0.5)
              else:
                  raise SystemExit("hub never came up")

              a = json.load(urllib.request.urlopen("http://127.0.0.1:8099/api/analytics", timeout=10))
              teams = list(a["teams"].values())
              assert teams, "no teams in the demo event"
              # The README promises the numbers crunch offline. They must not be zero.
              assert any(t["estimated"]["avgFuel"] > 0 for t in teams), "solver produced nothing"
              assert any(t["exact"]["rank"] for t in teams), "rankings fixture missing"
              assert any(t["epa"]["epa"] for t in teams), "epa fixture missing"
              assert cfg["multipliersFittedFrom"] > 0, "calibration never ran"

              csv = urllib.request.urlopen(
                  "http://127.0.0.1:8099/api/export.csv?table=teams", timeout=10).read()
              assert csv.count(b"\n") > 2, "csv export is empty"
              print(f"ok: {len(teams)} teams, fitted from {cfg['multipliersFittedFrom']} windows")
          finally:
              p.terminate()
          PY
